# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: gwork_db
    environment:
      POSTGRES_DB: gwork_db
      POSTGRES_USER: gwork_user
      POSTGRES_PASSWORD: gwork_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 